name: build-apk

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: pwsh
        run: |
          "ANDROID_HOME = $env:ANDROID_HOME"
          if (Test-Path "$env:ANDROID_HOME\build-tools") { "build-tools:"; Get-ChildItem "$env:ANDROID_HOME\build-tools" -Name }
          if (Test-Path "$env:ANDROID_HOME\platforms") { "platforms:"; Get-ChildItem "$env:ANDROID_HOME\platforms" -Name }

      - name: Install SDK components if missing
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          $hasBt = Get-ChildItem "$sdk\build-tools" -Directory -ErrorAction SilentlyContinue
          $hasPl = Get-ChildItem "$sdk\platforms" -Directory -ErrorAction SilentlyContinue
          if ($hasBt -and $hasPl) { "SDK 已就绪，跳过安装"; exit 0 }
          $sdkmanager = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter "sdkmanager.bat" -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $sdkmanager) { throw "找不到 sdkmanager，无法补装 SDK 组件" }
          "yes" | & $sdkmanager.FullName --sdk_root=$sdk "build-tools;35.0.0" "platforms;android-35"

      - name: Restore signing keystore
        shell: pwsh
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if ($env:KS_B64) {
            [IO.File]::WriteAllBytes("qrscan.keystore", [Convert]::FromBase64String($env:KS_B64))
            "keystore restored from secret"
          } else {
            "KEYSTORE_BASE64 未配置：本次会用一次性签名，覆盖安装已装机版本会冲突"
          }

      - name: Build APK
        shell: pwsh
        env:
          QRSCAN_STORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if (-not $env:QRSCAN_STORE_PASS) { $env:QRSCAN_STORE_PASS = 'android' }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Rename artifact by tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Copy-Item out/QRScan-v1.0.apk "out/QRScan-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: QRScan-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk